name: CI

on: [push, pull_request]

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      # prisma generate only needs the config to resolve; nothing in this job connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # The transpiler test py_compiles every template's output when Python is available.
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx jest

  engine:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m pytest # fake models: no keys, no database

  # Optional: run every graph's test cases against a live AgentForge (database, engine and provider
  # keys required). Set the AGENTFORGE_URL secret to its base URL to enable; otherwise this job is a no-op.
  graph-tests:
    runs-on: ubuntu-latest
    needs: [web, engine]
    env:
      AGENTFORGE_URL: ${{ secrets.AGENTFORGE_URL }}
    steps:
      - uses: actions/checkout@v4
        if: env.AGENTFORGE_URL != ''
      - uses: actions/setup-node@v4
        if: env.AGENTFORGE_URL != ''
        with: { node-version: 22 }
      - run: npm run test:graphs
        if: env.AGENTFORGE_URL != ''
